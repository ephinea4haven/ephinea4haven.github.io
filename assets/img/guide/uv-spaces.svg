    .t{fill:#cbd5e1;font-size:13px}
    .m{fill:#94a3b8;font-size:12px}
    .e{fill:none;stroke:#e2e8f0;stroke-width:2}
    .l{fill:#ede9fe;font-size:13px;font-weight:700}
    .pt{fill:#a78bfa;stroke:#ede9fe;stroke-width:1.5}
    .r{fill:#fbbf24;font-weight:800}
    .ar{stroke:#00d4ff;stroke-width:2;fill:none}
    .xr{stroke:#f87171;stroke-width:2.5}.xg{stroke:#4ade80;stroke-width:2.5}.xb{stroke:#60a5fa;stroke-width:2.5}
  </style>
  <rect x="20" y="40" width="120" height="70" rx="8" fill="rgba(0,212,255,.10)" stroke="#00d4ff" stroke-width="2"/>
