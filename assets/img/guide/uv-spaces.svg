<svg viewBox="0 0 920 280" width="920" height="280" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <pattern id="ck" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#1e3a5f"/><rect width="12.5" height="12.5" fill="#2563eb"/>
      <rect x="12.5" y="12.5" width="12.5" height="12.5" fill="#2563eb"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00d4ff"/>
    </marker>
  </defs>
  <style>
    .p{fill:rgba(96,165,250,.06);stroke:rgba(148,163,184,.55);stroke-width:1.5}
