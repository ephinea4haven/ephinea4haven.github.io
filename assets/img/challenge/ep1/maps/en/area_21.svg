<title id="title">AREA 21</title>
<desc id="desc"> A Hunter or Ranger takes room 2’s switch; everyone runs onward when turrets appear, without stopping to destroy them. Clear this group first: tap pink, retreat, destroy the turrets, then send one player through the fence. The runner holds far-side green to release the waiting teammates before leaving.</desc>
