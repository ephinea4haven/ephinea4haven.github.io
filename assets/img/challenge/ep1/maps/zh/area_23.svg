<title id="title">区域 23</title>
<desc id="desc"> 第二房先清陷阱，之后直奔传送点。 从入口方向看选左侧 1 号传送点（图中上方），不要选另一颗。 传送后立即回头，穿过背后的假墙，再进下一区传送点；别向长房深处跑。</desc>
