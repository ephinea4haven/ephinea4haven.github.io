</g><text x="68" y="66" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">清场后 Force 压入口机关；枪手单走西路，两人走东路，西路完成后回援。</tspan></text><g transform="translate(40 138)" filter="url(#shadow)">
  <rect x="-15" y="-19" width="30" height="30" rx="7" fill="#ffe45c" stroke="#061329" stroke-width="3"/>
  <text y="4" text-anchor="middle" fill="#08162b" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="950">2</text>
</g><text x="68" y="134" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">开箱廊只踩入口视角右侧机关；错误提示音可无视，另一个机关会关灯。</tspan></text><g transform="translate(40 206)" filter="url(#shadow)">
  <rect x="-15" y="-19" width="30" height="30" rx="7" fill="#ffe45c" stroke="#061329" stroke-width="3"/>
  <text y="4" text-anchor="middle" fill="#08162b" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="950">3</text>
</g><text x="68" y="202" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">岩石箱区有天花陷阱；中央平台箱子绕路太长，通常放弃。</tspan></text>
