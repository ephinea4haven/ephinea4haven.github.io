<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1210" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">区域 05</title>
<desc id="desc">穿墙捷径：无视敌人，穿过北墙进入传送点；同时避开下一出口房间的陷阱。 三机关接力：一人踩右侧机关；通过屏障后踩中央机关取箱；取箱者再踩左侧机关放行队友。 可选补给：传送点后的假墙内有箱子。非 TA 时可由机器人绕行回收。</desc>
