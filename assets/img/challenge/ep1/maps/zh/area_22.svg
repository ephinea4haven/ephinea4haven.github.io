<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">区域 22</title>
<desc id="desc"> 高 HP 队员绕栅栏边缘取中央机关，开门后立刻下平台；不要站着清这组炮台。 Force 取暗房入口视角右后方粉色照明；不要踩旁边的地板机关。 四台电脑中，触碰进门后紧邻右手的控制台，解除屏障；不是普通清敌门。 长走廊及图示陷阱区先确认再通过，Ranger 可提前射除。</desc>
