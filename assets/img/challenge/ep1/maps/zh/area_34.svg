<title id="title">区域 34</title>
<desc id="desc">击碎瀑布后的岩石进入治疗环。 机关组只踩图示正确机关。 房间中央机关负责照明且复位很快；留一人持续踩住，清场后继续为下一暗房照明。</desc>
