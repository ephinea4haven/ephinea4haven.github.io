<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1185" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">区域 16</title>
<desc id="desc"> 其余三人先到限时门前；留守者启动机关后立即赶回，转角别卡住。 从入口看只踩左侧机关（图中粉色）；另两颗会爆炸。 传送后的暗房没有照明机关，中央屏障会限制走位；清场再离开。 沿路标出的走廊陷阱先确认再通过。</desc>
