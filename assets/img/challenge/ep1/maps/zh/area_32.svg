</g><text x="68" y="66" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">一人向东击碎岩石解除屏障，既开放箱</tspan><tspan x="68" dy="24">子也避开后续陷阱。</tspan></text><g transform="translate(356 70)" filter="url(#shadow)">
  <rect x="-15" y="-19" width="30" height="30" rx="7" fill="#ffe45c" stroke="#061329" stroke-width="3"/>
  <text y="4" text-anchor="middle" fill="#08162b" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="950">2</text>
</g><text x="384" y="66" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="384" dy="0">限时门启动时会触发 Foie 陷阱，直接</tspan><tspan x="384" dy="24">无视。</tspan></text><g transform="translate(40 146)" filter="url(#shadow)">
  <rect x="-15" y="-19" width="30" height="30" rx="7" fill="#ffe45c" stroke="#061329" stroke-width="3"/>
  <text y="4" text-anchor="middle" fill="#08162b" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="950">3</text>
</g><text x="68" y="142" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">走先前开放的内侧路线，避开控制台；</tspan><tspan x="68" dy="24">普通路线靠近控制台会启动多枚 Foie</tspan><tspan x="68" dy="24">陷阱。</tspan></text>
