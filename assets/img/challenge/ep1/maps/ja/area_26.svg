<title id="title">エリア 26</title>
<desc id="desc"> 2部屋目の先の隠し箱部屋に固定バスター。装備可能なハンターへ渡し、旧武器は仲間へ。 Sakuraでは宝部屋に罠なし。FOやRAが回収し、主隊は先へ。</desc>
