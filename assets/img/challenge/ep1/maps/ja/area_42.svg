</g><text x="68" y="66" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">最初は左3・右1。左が速く、右は瓦礫破壊が必要。</tspan></text><g transform="translate(40 138)" filter="url(#shadow)">
  <rect x="-15" y="-19" width="30" height="30" rx="7" fill="#ffe45c" stroke="#061329" stroke-width="3"/>
  <text y="4" text-anchor="middle" fill="#08162b" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="950">2</text>
</g><text x="68" y="134" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">箱部屋ワープでフォイエ罠。外から銃で箱を壊してから入り、罠を撃つ。</tspan></text><g transform="translate(40 206)" filter="url(#shadow)">
  <rect x="-15" y="-19" width="30" height="30" rx="7" fill="#ffe45c" stroke="#061329" stroke-width="3"/>
  <text y="4" text-anchor="middle" fill="#08162b" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="950">3</text>
</g><text x="68" y="202" fill="#bcd7ea" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="650"><tspan x="68" dy="0">到着後は進行方向左のスイッチ。左組は3→3′、右組は扉から入る。</tspan></text>
