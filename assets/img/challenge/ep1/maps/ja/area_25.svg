<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 746" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">エリア 25</title>
<desc id="desc"> 最初の部屋と折り返す通路の罠を先に処理。 3つ目の小部屋の壁スイッチは撃たず、そのまま進む。 フォースが入口から左奥で点灯。照明スイッチの小部屋にも敵がいる。 4個のうち入口から左奥だけ踏む（図の右上・緑）。 開門後、フォースが横道の箱を回収し、主隊は次を殲滅。</desc>
