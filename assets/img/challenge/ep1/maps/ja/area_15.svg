<title id="title">エリア 15</title>
<desc id="desc"> 分岐では向かって左の1へ。1人が床を保持して仲間を通し、解除を待つ。 ワープ後のスイッチで岩を壊し、仲間と合流して次へ。 北の隠し壁の箱は任意。時間優先なら省略。</desc>
