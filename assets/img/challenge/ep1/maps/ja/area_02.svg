<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1061" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">エリア 02</title>
<desc id="desc">ボス前にハンターの予備スケープドールをフォース／レンジャーへ渡す。 時間制の緑スイッチ役は待機。ゲート通過組は1→1′へ。 転送後すぐ後ろの2→2′へ入り紫スイッチ。正面の4番は箱部屋で、TAでは無視。 敵を殲滅してから1人が時計床を踏み、仲間をワープ1へ通す。 1→1′の後は後ろの2へ。2′で紫スイッチを押して仲間の扉を開く。 正面の4は任意の回収寄り道。タイム重視なら入らない。</desc>
