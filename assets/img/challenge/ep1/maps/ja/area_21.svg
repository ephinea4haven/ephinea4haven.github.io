<title id="title">エリア 21</title>
<desc id="desc"> 2部屋目はハンターかレンジャーが押す。砲台が出たら全員そのまま次へ進み、壊さない。 ここは先に処理。桃色を短く踏んで退き、砲台を壊してから1人を柵の先へ。 先行者は奥の緑を踏み、待機中の仲間を通してから進む。</desc>
