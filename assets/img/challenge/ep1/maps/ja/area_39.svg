<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 909" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">エリア 39</title>
<desc id="desc">2つ目の通路部屋で岩を破壊。砲台が出るためマシンガン推奨。 進行方向右の岩とスイッチは罠なので無視。 1→1′後、入口左のスイッチの裏にある隠しスイッチを踏む。</desc>
