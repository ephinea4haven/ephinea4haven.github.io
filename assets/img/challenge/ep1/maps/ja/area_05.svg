<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 967" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">エリア 05</title>
<desc id="desc">2部屋目の敵を無視し、北の隠し壁から1へ。 右の青い床で仲間を通し、扉付近のスイッチと連携して箱を回収。 回収役は緑、続いて入口近くの桃色を踏み、仲間を通す。 この部屋の敵は無視。北の隠し壁を抜け1→1′へ。 右の青を踏んで1人を通し、扉付近のスイッチと連携して箱を回収。 回収役は緑、次に入口付近の桃色を踏み、待機中の仲間を通す。</desc>
