<title id="title">EP2 C3 区域 16</title>
<desc id="desc">同色机关对应屏障 时钟：限时机关 灯泡：照明 绿色圆环：回复 彩色叉框：障壁 / 陷阱 箱内数字：物资数量 字母与撇号：配对传送 开场由法师进入开阔处处理 Mericarol，击倒后出现下一地区传送；不是整张图都要绕一遍。 回复装置属于可选绕路，需要经南端 A 传送走外围；狭窄通道的锯刃先看时机。</desc>
