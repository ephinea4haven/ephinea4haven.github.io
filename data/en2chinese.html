<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="description" content="PSOBB 游戏物品中英文对照表">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>游戏物品中英对照 | Ephinea PSOBB</title>
    <link rel="stylesheet" type="text/css" href="/assets/css/unified-style.css">
    <style>
        /* Search bar — matches price_guide.html convention */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            align-items: center;
        }
        .filter-bar input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-bar input[type="text"]:focus {
            border-color: rgba(0, 212, 255, 0.6);
        }
        .filter-bar input::placeholder { color: #64748b; }

        #result-count {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 12px;
        }

        /* Three-column lookup table */
        #lookup-table td:nth-child(1) {
            width: 40%;
            font-family: 'Segoe UI', 'Courier New', monospace;
            letter-spacing: 0.3px;
        }
        #lookup-table td:nth-child(2) { width: 30%; }
        #lookup-table td:nth-child(3) { width: 30%; }
        #lookup-table td.empty { color: var(--text-muted); }
        #no-results {
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <page-chrome title="游戏物品中英对照"></page-chrome>

    <div class="content-container">
        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="搜索英文 / 中文 / 日文物品名…">
        </div>
        <div id="result-count"></div>

        <table id="lookup-table">
            <thead>
                <tr>
                    <th>英文 / English</th>
                    <th>中文</th>
                    <th>日本語</th>
                </tr>
            </thead>
            <tbody id="lookup"></tbody>
        </table>
        <div id="no-results" style="display:none;">没有匹配的物品</div>
    </div>

</body>

</html>
