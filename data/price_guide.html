<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Ephinea PSOBB 物品价格参考表">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>物品价格参考 | Ephinea PSOBB</title>
    <link rel="stylesheet" type="text/css" href="/assets/css/unified-style.css">
    <style>
        .price-notice {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.25);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 24px;
            color: #fbbf24;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Search & filter */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .filter-bar input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-bar input[type="text"]:focus {
            border-color: rgba(0, 212, 255, 0.6);
        }
        .filter-bar input::placeholder { color: #64748b; }

        /* Section nav */
        .section-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 24px;
        }
        .section-nav button {
            padding: 6px 14px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .section-nav button:hover { background: rgba(0, 212, 255, 0.15); color: #cbd5e1; }
        .section-nav button.active {
            background: rgba(0, 212, 255, 0.25);
            color: #e2e8f0;
            border-color: rgba(0, 212, 255, 0.5);
        }

        /* Tables */
        .price-section { margin-bottom: 30px; }
        .price-section h3 {
            color: #60a5fa;
            font-size: 1.1em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
        }
        .content-container .price-table {
            font-size: 13px;
            width: 100%;
            overflow: visible;
        }
        .price-table th, .price-table td {
            padding: 6px 8px;
            text-align: center;
            white-space: nowrap;
        }
        .price-table th:first-child, .price-table td:first-child {
            text-align: left;
            white-space: normal;
            min-width: 120px;
        }
        .price-table thead th:first-child,
        .price-table tbody tr:not(.price-note-row) > td:first-child {
            position: sticky;
            left: 0;
            box-shadow: 2px 0 0 rgba(0, 212, 255, 0.15);
        }
        .price-table thead th:first-child {
            z-index: 2;
            background-color: var(--bg-primary);
            background-image: var(--table-header-bg);
        }
        .price-table tbody tr:not(.price-note-row) > td:first-child {
            z-index: 1;
            color: #fbbf24;
            font-weight: 500;
            background: var(--bg-primary);
        }
        .price-table tbody tr:not(.price-note-row):hover > td:first-child {
            background: #0c213f;
        }
        .price-table .val-inest { color: #f472b6; font-style: italic; font-size: 12px; }
        .price-table .val-na { color: #475569; }
        .price-table .val-zero { color: #64748b; }
        .price-table .price-note-row td {
            max-width: 720px;
            padding: 10px 12px;
            color: #94a3b8;
            background: rgba(96, 165, 250, 0.06);
            font-size: 12px;
            line-height: 1.6;
            text-align: left;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .table-scroll { overflow-x: auto; margin-bottom: 8px; }

        .match-count { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }

        .source-link {
            font-size: 13px;
            color: #64748b;
            margin-top: 16px;
            text-align: right;
        }
        .source-link a { color: #60a5fa; }

        @media (max-width: 768px) {
            .price-table { font-size: 12px; }
            .filter-bar input[type="text"] { min-width: 150px; }
        }
    </style>
</head>

<body>
    <page-chrome title="物品价格参考"></page-chrome>

    <div class="content-container">

        <h2>Ephinea 物品价格参考表</h2>

        <div class="price-notice">
            本表仅供参考。物品价格会根据供需关系波动，实际交易价格可能与表中数值不同。所有价格单位为 <strong>PD（Photon Drop / 光子微晶）</strong>。<br>
            "<strong>无法估价</strong>" 表示该物品稀有度极高，建议通过拍卖确定价格。
        </div>

        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="搜索物品名称...">
        </div>

        <div class="section-nav" id="section-nav"></div>

        <div id="match-count" class="match-count"></div>

        <div id="price-content"></div>

        <div class="source-link">
            数据来源: <a href="https://wiki.pioneer2.net/w/Price_guide" target="_blank">wiki.pioneer2.net/w/Price_guide</a>
        </div>

    </div>


</body>
</html>
