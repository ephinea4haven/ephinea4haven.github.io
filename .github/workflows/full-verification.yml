name: Full verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DROPCHARTS_I18N_AUTHORITY: ${{ github.workspace }}/dropcharts/i18n_names.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out item-name authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: warmonipa/dropcharts
          ref: 511d3ead56b059c6a64b0274cd34e11d1794886b
          path: dropcharts

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Run business tests
        run: npm test

      - name: Build production artifact
        run: npm run build

      - name: Verify reproducible build
        shell: bash
        run: |
          cp _site/build-manifest.json "$RUNNER_TEMP/build-manifest.json"
          npm run build
          cmp "$RUNNER_TEMP/build-manifest.json" _site/build-manifest.json

      # Browser tests run in parallel shards against this exact build output.
      - name: Hand the build to the browser tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: |
            _site
            src/app/generated
          include-hidden-files: true
          retention-days: 1

  browser-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3]
    env:
      DROPCHARTS_I18N_AUTHORITY: ${{ github.workspace }}/dropcharts/i18n_names.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out item-name authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: warmonipa/dropcharts
          ref: 511d3ead56b059c6a64b0274cd34e11d1794886b
          path: dropcharts

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Use the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build

      - name: Run production browser tests (shard ${{ matrix.shard }} of 3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

