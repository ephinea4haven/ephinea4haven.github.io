name: Full verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DROPTABLE_I18N_AUTHORITY: ${{ github.workspace }}/droptable/i18n_names.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out item-name authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: warmonipa/dropcharts
          ref: 39b6a8601d9da0cf88e87cf41b6ab5c56318c9bc
          path: droptable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Run business tests
        run: npm test

      - name: Build production artifact
        run: npm run build

      - name: Verify reproducible build
        shell: bash
        run: |
          cp _site/build-manifest.json "$RUNNER_TEMP/build-manifest.json"
          npm run build
          cmp "$RUNNER_TEMP/build-manifest.json" _site/build-manifest.json

      # Browser tests run in parallel shards against this exact build output.
      - name: Hand the build to the browser tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-build
          path: |
            _site
            src/app/generated
          include-hidden-files: true
          retention-days: 1

  browser-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3]
    env:
      DROPTABLE_I18N_AUTHORITY: ${{ github.workspace }}/droptable/i18n_names.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out item-name authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: warmonipa/dropcharts
          ref: 39b6a8601d9da0cf88e87cf41b6ab5c56318c9bc
          path: droptable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Use the verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-build

      - name: Run production browser tests (shard ${{ matrix.shard }} of 3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

