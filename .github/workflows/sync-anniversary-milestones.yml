name: Sync anniversary milestones

on:
  schedule:
    - cron: '7,37 0-17,23 12-31 8 *'
    - cron: '7,37 0-17,23 1-9 9 *'
    - cron: '17 * 10 9 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-anniversary-milestones
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '17 * 10 9 *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Sync official milestones
        run: npm run sync:anniversary

      - name: Verify synchronized snapshot
        run: npm run test:anniversary-sync

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- event/anniversary/2026.html index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changed snapshot
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push changed snapshot
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event/anniversary/2026.html index.html
          git commit -m "Update 2026 anniversary milestones"
          git push origin master

      - name: Deploy changed snapshot
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master

  close-event-window:
    if: github.event_name == 'schedule' && github.event.schedule == '17 * 10 9 *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disable scheduled milestone synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable sync-anniversary-milestones.yml --repo "$GITHUB_REPOSITORY"
