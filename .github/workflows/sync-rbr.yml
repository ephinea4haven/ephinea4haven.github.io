name: Sync RBR rotation

on:
  schedule:
    - cron: '17 * * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-rbr-rotation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Check for a complete current RBR rotation
        run: python3 scripts/build_rbr_data.py --require-current

      - name: Verify RBR data
        run: >-
          python3 -m unittest
          scripts.test_build_rbr_data
          scripts.test_rbr_tiers
          scripts.test_rbr_tier_charts

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/rbr/source.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build changed snapshot
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push changed snapshot
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rbr/source.json
          git commit -m "Update weekly RBR rotation"
          git pull --rebase origin master
          git push origin master

      - name: Deploy changed snapshot
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
