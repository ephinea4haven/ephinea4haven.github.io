    <header class="year-hero"><span class="section-kicker">イベント復帰</span><h2>2020年ハロウィンイベント</h2><p>公式履歴で2017年の次に記録されるのは2020年です。Cookieと高難度のHalloweenクエストが復帰しました。</p><div class="year-meta"><span>10月25日～11月8日</span><span>2週間</span><span>Halloweenクエスト</span></div></header>
    <ul><li><span data-item-en="Halloween Cookie"></span>はゲーム全体の通常の敵からドロップします。</li><li>箱と逃走中のラッピーからCookieはドロップしません。</li><li>Cookieは敵が密集するHalloweenイベントクエストへの入場に使います。</li><li>公式履歴に2018・2019年の独立したイベントがないため、当サイトでも架空の年度ページは作成していません。</li></ul>
