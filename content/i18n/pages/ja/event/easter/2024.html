    <header class="year-hero"><span class="section-kicker">RBR導入の転換点</span><h2>2024年イースターイベント</h2><p>現在型イースターの転換点です。初めて<span data-item-en="Event Egg"></span>にRBRクエスト補正が適用され、Egg5個の賞品も変更されました。</p><div class="year-meta"><span>3月30日～4月27日</span><span>4週間</span><span>EggにRBRが初適用</span></div></header>
    <ul><li>RBR Egg補正：1人+15%、2人+20%、3～4人+25%。</li><li>Egg5個の抽選に<span data-item-en="STEALTH SUIT"></span>と<span data-item-en="Musashi"></span>を追加。</li><li><span data-item-en="Halloween Cookie"></span>を削除。<span data-item-en="Pioneer Parts"></span>と<span data-item-en="Yahoo!'s engine"></span>を<span data-item-en="Heart of Morolian"></span>と<span data-item-en="Amitie's Memo"></span>へ変更。</li></ul>
