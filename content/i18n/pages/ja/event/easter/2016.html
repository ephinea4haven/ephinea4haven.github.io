    <header class="year-hero"><span class="section-kicker">Ephinea初のエッグハント</span><h2>2016年イースターイベント</h2><p>初回は全エリアの敵が落とす独立通貨<span data-item-en="Event Egg"></span>を導入し、アカウント別の発見数ランキングを設けました。</p><div class="year-meta"><span>3月19日～4月9日</span><span>3週間</span><span>上位10名のランキング</span></div></header>
    <ul><li>通常ドロップ可能な敵なら<span data-item-en="Event Egg"></span>を落とす可能性があります。逃走中のラッピーは対象外です。</li><li><span data-item-en="Event Egg"></span>は直接使用できず、後に公開されるEgg Shopの交換や抽選専用です。</li><li>アカウント別のEgg発見数を記録し、終了時の上位10名に特別報酬を配布します。</li><li>同時期に一部ミュージックディスクのドロップも追加。エグ・ラッピーの<span data-item-en="Easter Egg"></span>は<span data-item-en="Event Egg"></span>とは全く別です。</li></ul>
