    <header class="year-hero"><span class="section-kicker">ショップを拡充</span><h2>2022年イースターイベント</h2><p>カレンのTypeMに複数のエレメント版が揃っています。EggドロップはRBR導入前のルールです。</p><div class="year-meta"><span>4月2日～4月30日</span><span>4週間</span><span>TypeMショップ</span></div></header>
    <ul><li>カレンの<span data-item-en="TypeGU/Hand"></span>、<span data-item-en="TypeGU/MECHGUN"></span>、<span data-item-en="TypeME/MECHGUN"></span>、<span data-item-en="TypeSH/SHOT"></span>にチャージ／バーサーク／スピリットの組み合わせがあります。</li><li>抽選はEgg1個が必ず当選、5個が50%、10個が10%という構成を継続します。</li><li>この年の<span data-item-en="Event Egg"></span>はサーバーのドロップ率補正やRBRの影響を受けません。</li></ul>
