<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Ephinea PSOBB 周年活动 (2016-2026)">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="page-title">周年活动 | Ephinea PSOBB</title>
    <link rel="stylesheet" type="text/css" href="/assets/css/unified-style.css">
    <style>
        .event-masthead {
            position: relative;
            --year-accent: hsl(var(--anniv-year-hue, 188) 92% 58%);
            width: 100%;
            max-width: none;
            margin: 0;
            overflow: hidden;
            border: 1px solid hsl(var(--anniv-year-hue, 188) 92% 58% / 0.32);
            border-radius: 16px;
            background:
                linear-gradient(90deg, hsl(var(--anniv-year-hue, 188) 92% 58% / 0.09), transparent 28%),
                hsl(226 58% 9% / 0.94);
            box-shadow: 0 12px 32px hsl(225 90% 4% / 0.24), inset 0 1px hsl(0 0% 100% / 0.08);
            isolation: isolate;
        }

        .event-masthead::before {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(hsl(var(--anniv-year-hue, 188) 92% 58% / 0.055) 1px, transparent 1px),
                linear-gradient(90deg, hsl(var(--anniv-year-hue, 188) 92% 58% / 0.055) 1px, transparent 1px);
            background-size: 24px 24px;
            mask-image: linear-gradient(to right, black, transparent 62%);
            content: "";
        }

        .event-masthead::after {
            position: absolute;
            inset: auto 0 0;
            height: 2px;
            background: linear-gradient(90deg, var(--year-accent), hsl(43 96% 64%), transparent 72%);
            content: "";
        }

        .masthead-main {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 24px;
            min-height: 88px;
            padding: 14px 20px;
        }

        .masthead-copy {
            min-width: 0;
        }

        .masthead-facts {
            display: flex;
            flex-wrap: wrap;
            justify-self: end;
            gap: 8px;
            margin: 0;
        }

        .milestone-heading-title {
            position: relative;
            flex: 0 0 auto;
            padding-right: 70px;
            isolation: isolate;
        }

        .masthead-facts span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 11px;
            border: 1px solid hsl(var(--anniv-year-hue, 188) 92% 58% / 0.2);
            border-radius: 999px;
            background: hsl(226 58% 9% / 0.54);
            color: hsl(210 25% 80%);
            font-size: 12px;
            font-weight: 700;
        }

        .masthead-facts span::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--year-accent);
            box-shadow: 0 0 12px var(--year-accent);
            content: "";
        }

        .masthead-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin: 0;
            color: hsl(210 25% 75%);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-decoration: none;
            transition: color 160ms ease, transform 160ms ease;
        }

        .masthead-back::before {
            display: grid;
            width: 28px;
            height: 28px;
            place-items: center;
            border: 1px solid hsl(210 25% 75% / 0.2);
            border-radius: 50%;
            content: "←";
        }

        .masthead-back:hover {
            color: hsl(43 96% 64%);
            transform: translateX(-2px);
        }

        .masthead-kicker {
            margin: 0 0 4px;
            color: var(--year-accent);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .masthead-title,
        .event-masthead #project_title {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: hsl(210 40% 97%);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.035em;
            line-height: 1.1;
            text-shadow: none;
        }

        .masthead-title strong {
            padding: 5px 8px;
            border: 1px solid hsl(var(--anniv-year-hue, 188) 92% 58% / 0.3);
            border-radius: 999px;
            background: hsl(var(--anniv-year-hue, 188) 92% 58% / 0.1);
            color: var(--year-accent);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 1;
        }

        .milestone-section-update {
            --update-stamp-scale: 0.86;
            --update-stamp-tilt: -6deg;
            position: absolute;
            right: 0;
            bottom: 1px;
            z-index: 3;
            pointer-events: none;
        }

        .anniversary-page-shell {
            position: relative;
            width: min(calc(100% - 32px), 1320px);
            margin: 0 auto;
            isolation: isolate;
        }

        .anniversary-page-shell::before,
        .anniversary-page-shell::after {
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(2px);
            content: "";
            pointer-events: none;
        }

        .anniversary-page-shell::before {
            top: 8vh;
            left: -18vw;
            width: 52vw;
            height: 52vw;
            background: radial-gradient(circle, hsl(var(--anniv-year-hue, 188) 92% 58% / 0.11), transparent 68%);
        }

        .anniversary-page-shell::after {
            right: -20vw;
            bottom: 4vh;
            width: 56vw;
            height: 56vw;
            background: radial-gradient(circle, hsl(272 85% 60% / 0.1), transparent 70%);
        }

        .anniversary-workspace {
            position: relative;
            display: block;
            margin-top: 16px;
        }

        .anniversary-year-rail-layer {
            position: sticky;
            top: 16px;
            z-index: 40;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .anniversary-year-rail {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            width: 296px;
            max-height: calc(100vh - 32px);
            overflow: auto;
            border: 1px solid hsl(var(--anniv-year-hue, 188) 92% 58% / 0.22);
            border-radius: 18px;
            background:
                linear-gradient(hsl(var(--anniv-year-hue, 188) 92% 58% / 0.04) 1px, transparent 1px),
                hsl(226 58% 9% / 0.94);
            background-size: 100% 24px;
            box-shadow: 0 18px 46px hsl(225 90% 4% / 0.3);
            pointer-events: auto;
            transform: translateX(0);
            transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 220ms ease-out;
            will-change: transform;
        }

        .year-rail-backdrop {
            position: fixed;
            inset: 0;
            border: 0;
            background: hsl(225 75% 4% / 0.52);
            opacity: 1;
            pointer-events: auto;
            cursor: default;
            transition: opacity 180ms ease-out, visibility 180ms;
        }

        .year-rail-heading {
            padding: 20px 18px 16px;
            border-bottom: 1px solid hsl(var(--anniv-year-hue, 188) 92% 58% / 0.14);
        }

        .year-rail-toggle {
            position: absolute;
            top: 12px;
            left: 256px;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            min-width: 28px;
            height: 28px;
            padding: 0;
            border: 1px solid hsl(var(--anniv-year-hue, 188) 92% 58% / 0.22);
            border-radius: 8px;
            background: hsl(226 58% 15% / 0.92);
            color: hsl(210 25% 78%);
            font: 800 18px / 1 sans-serif;
            pointer-events: auto;
            cursor: pointer;
            transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
        }

        .year-rail-toggle-label {
            display: none;
            font-size: 12px;
            letter-spacing: 0.04em;
            line-height: 1;
            white-space: nowrap;
        }

        .year-rail-toggle-icon {
            display: inline-block;
            flex: 0 0 auto;
            line-height: 1;
        }

        .year-rail-toggle:hover,
        .year-rail-toggle:focus-visible {
            border-color: var(--year-accent);
            color: var(--year-accent);
            outline: 0;
        }

        .anniversary-page-shell.is-year-rail-collapsed .anniversary-year-rail {
            transform: translateX(calc(-100% - 12px));
            border-radius: 12px;
            box-shadow: 0 10px 28px hsl(225 90% 4% / 0.22);
        }

        .anniversary-page-shell.is-year-rail-collapsed .year-rail-backdrop {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .anniversary-page-shell.is-year-rail-collapsed .year-rail-heading,
        .anniversary-page-shell.is-year-rail-collapsed .year-nav,
        .anniversary-page-shell.is-year-rail-collapsed .year-rail-note {
            display: none;
        }

        .anniversary-page-shell.is-year-rail-collapsed .year-rail-toggle {
            top: 7px;
            left: 7px;
            gap: 6px;
            width: auto;
            min-width: 68px;
            padding: 0 9px;
            background: hsl(226 58% 13% / 0.96);
        }

        .anniversary-page-shell.is-year-rail-collapsed .year-rail-toggle-label {
            display: block;
        }

        .anniversary-page-shell.is-year-rail-collapsed .year-rail-toggle-icon {
            transform: rotate(180deg);
        }

        .year-rail-heading span {
            display: block;
            color: var(--year-accent);
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .year-rail-heading strong {
            display: block;
            margin-top: 6px;
            color: #fff;
            font-size: 17px;
            letter-spacing: -0.02em;
        }

        .anniversary-year-rail .year-nav {
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
            margin: 0;
            padding: 12px;
        }

        .anniversary-year-rail .year-nav::before {
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 25px;
            width: 1px;
            background: linear-gradient(var(--year-accent), hsl(272 85% 67% / 0.2));
            content: "";
        }

        .anniversary-year-rail .year-nav a,
        .anniversary-year-rail .year-nav .year-current {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            min-width: 0;
            padding: 9px 10px 9px 30px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: hsl(210 18% 66%);
            font-size: 13px;
            font-weight: 750;
            text-align: left;
            text-decoration: none;
        }

        .anniversary-year-rail .year-nav a::before,
        .anniversary-year-rail .year-nav .year-current::before {
            position: absolute;
            left: 10px;
            width: 8px;
            height: 8px;
            border: 2px solid hsl(210 18% 44%);
            border-radius: 50%;
            background: hsl(226 58% 9%);
            content: "";
        }

        .anniversary-year-rail .year-nav a:hover {
            background: hsl(var(--anniv-year-hue, 188) 92% 58% / 0.08);
            color: hsl(210 30% 88%);
        }

        .anniversary-year-rail .year-nav .year-current {
            background: linear-gradient(90deg,
                hsl(var(--anniv-year-hue, 188) 92% 58% / 0.2),
                hsl(var(--anniv-year-hue, 188) 92% 58% / 0.04));
            color: #fff;
            box-shadow: inset 3px 0 var(--year-accent);
        }

        .anniversary-year-rail .year-nav .year-current::before {
            border-color: var(--year-accent);
            background: var(--year-accent);
            box-shadow: 0 0 12px var(--year-accent);
        }

        .year-rail-note {
            margin: 0;
            padding: 14px 18px 18px;
            border-top: 1px solid hsl(var(--anniv-year-hue, 188) 92% 58% / 0.1);
            color: hsl(210 16% 52%);
            font-size: 11px;
            line-height: 1.55;
        }

        .anniversary-workspace > #content {
            width: 100%;
            max-width: none;
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
        }

        @media (max-width: 760px) {
            .anniversary-page-shell {
                width: min(calc(100% - 20px), 1320px);
            }

            .event-masthead {
                border-radius: 14px;
            }

            .masthead-main {
                grid-template-columns: auto minmax(0, 1fr);
                gap: 12px;
                min-height: 76px;
                padding: 10px 14px;
            }

            .masthead-back {
                gap: 0;
                font-size: 0;
            }

            .masthead-back::before {
                font-size: 14px;
            }

            .masthead-title {
                flex-wrap: nowrap;
                font-size: 21px;
            }

            .event-masthead #project_title {
                font-size: 21px;
            }

            .masthead-facts {
                display: none;
            }

            .milestone-section-update {
                --update-stamp-scale: 0.78;
                right: -4px;
                bottom: 1px;
            }

            .milestone-heading-title {
                padding-right: 0;
            }

            .milestone-heading-title h3 {
                white-space: nowrap;
            }

            .anniversary-workspace {
                margin-top: 12px;
            }

            .anniversary-year-rail-layer {
                top: 8px;
            }

            .anniversary-year-rail {
                width: min(330px, 86vw);
                max-height: calc(100vh - 16px);
                border-radius: 14px;
            }

            .year-rail-toggle {
                left: calc(min(330px, 86vw) - 40px);
            }

            .anniversary-page-shell.is-year-rail-collapsed .year-rail-toggle {
                position: fixed;
                top: auto;
                bottom: max(16px, env(safe-area-inset-bottom));
                left: 7px;
            }

            .year-rail-note {
                display: none;
            }

            .anniversary-year-rail .year-nav {
                display: grid;
                gap: 6px;
                padding: 10px;
            }

            .anniversary-year-rail .year-nav::before {
                display: none;
            }

            .anniversary-year-rail .year-nav a,
            .anniversary-year-rail .year-nav .year-current {
                padding: 10px 12px 10px 34px;
                border: 0;
                border-radius: 8px;
            }

            .anniversary-year-rail .year-nav a::before,
            .anniversary-year-rail .year-nav .year-current::before {
                display: block;
                left: 12px;
            }

            .anniversary-year-rail .year-nav .year-current {
                background: linear-gradient(90deg,
                    hsl(var(--anniv-year-hue, 188) 92% 58% / 0.2),
                    hsl(var(--anniv-year-hue, 188) 92% 58% / 0.04));
                color: #fff;
                box-shadow: 0 0 18px hsl(var(--anniv-year-hue, 188) 92% 58% / 0.22);
            }
        }

        .year-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .year-nav a,
        .year-nav .year-current {
            padding: 6px 14px;
            border: 1px solid var(--accent-25);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .year-nav a {
            background: var(--accent-10);
            color: var(--text-primary);
        }

        .year-nav a:hover {
            background: var(--accent-25);
            color: var(--accent);
        }

        .year-nav .year-current {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent), var(--accent-alt));
            color: var(--accent-dark);
        }

        .year-hero {
            margin-bottom: 24px;
            padding: 22px;
            border: 1px solid var(--accent-25);
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-10), rgba(138, 43, 226, 0.08));
        }

        .year-hero h2 {
            margin-top: 0;
        }

        .year-meta,
        .source-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .year-meta span {
            padding: 4px 10px;
            border: 1px solid var(--accent-25);
            border-radius: 999px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .rule-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin: 14px 0 22px;
        }

        .rule-card,
        .year-callout {
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.025);
        }

        .rule-card strong {
            display: block;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .rule-card span {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .change-list li,
        .quest-list li {
            margin-bottom: 6px;
        }

        .year-callout {
            margin: 16px 0;
            border-left: 3px solid var(--accent);
            color: var(--text-secondary);
        }

        .item-bilingual {
            white-space: nowrap;
        }

        .item-bilingual .item-zh {
            color: var(--accent);
            font-weight: 650;
        }

        .item-bilingual .item-en {
            color: var(--text-secondary);
            font-size: 0.88em;
        }

        .source-links {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        .shop-table-wrap {
            overflow-x: auto;
            margin: 12px 0 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .shop-table {
            width: 100%;
            min-width: 680px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.02);
        }

        .shop-table th,
        .shop-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            vertical-align: top;
        }

        .shop-table th {
            background: var(--accent-10);
            color: var(--text-secondary);
            font-size: 12px;
            white-space: nowrap;
        }

        .shop-table tr:last-child td {
            border-bottom: 0;
        }

        .section-id-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            margin: -3px 2px;
            object-fit: contain;
            vertical-align: middle;
            filter: drop-shadow(0 0 5px hsl(188 92% 58% / 0.2));
        }

        .quest-stats-table .section-id-icon {
            width: 28px;
            height: 28px;
            margin: 0;
        }

        .ta-ranking-table {
            min-width: 1180px;
            font-variant-numeric: tabular-nums;
        }

        .ta-ranking-table[data-ta-ranking-year="2021"] {
            min-width: 480px;
        }

        .ta-ranking-table td {
            white-space: nowrap;
        }

        .ta-ranking-table td:nth-child(3) {
            font-weight: 700;
        }

        .reward-columns {
            columns: 2 260px;
            column-gap: 28px;
        }

        .reward-columns li {
            break-inside: avoid;
            margin-bottom: 5px;
        }

        .npc-image-cell {
            width: 96px;
            text-align: center !important;
            vertical-align: middle !important;
        }

        .npc-thumbnail-button {
            display: block;
            overflow: hidden;
            width: 82px;
            margin: 0 auto;
            padding: 0;
            border: 1px solid rgba(255, 211, 91, 0.52);
            border-radius: 9px;
            background: var(--bg-secondary);
            box-shadow: 0 0 0 rgba(255, 211, 91, 0);
            cursor: zoom-in;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .npc-thumbnail-button:hover {
            border-color: #ffe08a;
            box-shadow: 0 0 16px rgba(255, 211, 91, 0.32);
            transform: translateY(-2px) scale(1.03);
        }

        .npc-thumbnail-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .npc-thumbnail-button img {
            display: block;
            width: 100%;
            height: 54px;
            object-fit: contain;
            background: #202020;
        }

        .npc-image-missing {
            color: var(--text-muted);
        }

        .npc-image-cell-multiple {
            width: 190px;
            white-space: nowrap;
        }

        .npc-image-cell-multiple .npc-thumbnail-button {
            display: inline-block;
            width: 54px;
            margin: 0 3px;
        }

        .npc-image-cell-multiple .npc-thumbnail-button img {
            height: 54px;
        }

        .npc-preview-popover {
            position: fixed;
            z-index: 1200;
            width: min(260px, calc(100vw - 24px));
            padding: 12px;
            border: 1px solid rgba(255, 211, 91, 0.55);
            border-radius: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.62), 0 0 24px rgba(255, 211, 91, 0.14);
        }

        .npc-preview-popover[hidden] {
            display: none;
        }

        .npc-preview-popover img {
            display: block;
            width: 100%;
            max-height: min(52vh, 360px);
            margin: 0 auto;
            border-radius: 8px;
            background: #202020;
            object-fit: contain;
        }

        .npc-preview-popover p {
            margin: 9px 30px 0;
            color: var(--text-secondary);
            text-align: center;
        }

        .npc-preview-close {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: 21px;
            line-height: 26px;
            cursor: pointer;
        }

        .anniv-2025 {
            --a-gold: hsl(43 96% 64%);
            --a-cyan: hsl(188 92% 58%);
            --a-violet: hsl(268 85% 67%);
            --a-panel: hsl(226 58% 13% / 0.82);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 40px;
        }

        .anniv-2025 > * {
            min-width: 0;
        }

        .anniv-2025 .event-hero {
            position: relative;
            overflow: hidden;
            min-height: 300px;
            padding: 40px;
            border: 1px solid hsl(188 80% 60% / 0.28);
            border-radius: 24px;
            background:
                radial-gradient(circle at 78% 24%, hsl(43 96% 64% / 0.2), transparent 28%),
